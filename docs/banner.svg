<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Modal Current banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a12"/>
      <stop offset="1" stop-color="#100b07"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- wordmark on LEFT (mirrored layout) -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="70" y="120" fill="#ffffff" font-size="58" font-weight="800" letter-spacing="1">Modal <tspan fill="#f0a84b">Current</tspan></text>
    <text x="72" y="163" fill="#d8c9b8" font-size="21">POD &amp; exact DMD verified against known synthetic ground truth</text>
    <text x="72" y="201" fill="#9b8770" font-family="Consolas, monospace" font-size="15">u = Σ aₖ e^{γₖt} cos(ωₖt+φₖ) shapeₖ(x) · NumPy-only</text>
  </g>
  <!-- mode shapes on RIGHT -->
  <g transform="translate(600,40)">
    <!-- axis -->
    <line x1="20" y1="110" x2="560" y2="110" stroke="#6b5a45" stroke-width="2"/>
    <!-- mode 1: one hump -->
    <path d="M 40 110 C 150 -10, 330 -10, 440 110" stroke="#f0a84b" stroke-width="4" fill="none"/>
    <!-- mode 2: node in middle -->
    <path d="M 40 110 C 120 30, 160 190, 240 110 S 360 30, 440 110" stroke="#7fb8d8" stroke-width="3.5" fill="none" opacity="0.9"/>
    <!-- mode 3: two nodes -->
    <path d="M 40 110 C 90 50, 110 50, 130 110 S 170 170, 190 110 S 230 50, 250 110 S 290 170, 310 110 S 350 50, 370 110 S 410 170, 440 110" stroke="#a4d4a0" stroke-width="3" fill="none" opacity="0.8"/>
    <!-- eigenvalue markers -->
    <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
      <circle cx="490" cy="70" r="6" fill="#f0a84b"/><text x="490" y="52" fill="#f0a84b">γ+iω</text>
      <circle cx="515" cy="150" r="6" fill="#7fb8d8"/>
      <circle cx="470" cy="185" r="6" fill="#a4d4a0"/>
      <text x="500" y="218" fill="#9b8770">spectrum = log(μ)/dt</text>
    </g>
    <text x="30" y="228" fill="#9b8770" font-family="Consolas, monospace" font-size="14">POD modes φᵢ(x) · energy Sᵢ²/ΣSⱼ² · exact-DMD φₖ = YV_rS_r⁻¹wₖ/μₖ</text>
  </g>
</svg>
